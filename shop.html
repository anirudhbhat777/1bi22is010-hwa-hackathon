<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shop — Sniffscape</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600&family=Fraunces:wght@600;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/extra.css">
</head>
<body class="antialiased bg-[#faf7f2] text-[#1f2933]">
  <div id="site-header"></div>

  <section class="section">
    <div class="section-inner">
      <div class="section-head">
        <span class="section-kicker">Our collection</span>
        <h2 class="text-[#1f2933] font-heading font-bold mb-2">The Sniffscape range</h2>
        <p class="text-[#4b5563]">Premium enrichment for calm, engaged dogs.</p>
      </div>
      <div class="product-grid">
        <div class="product-card">
          <div class="product-image" style="height:400px;">
            <img src="images/hero.jpg" alt="Sniffscape Infinity" class="image-cover" onerror="this.parentElement.innerHTML='<span>Image unavailable</span>'">
          </div>
          <div class="product-info">
            <div class="product-name">Sniffscape Infinity</div>
            <div class="product-price">$149</div>
            <div class="product-actions">
              <a href="product.html" class="btn btn-secondary w-full">View Details</a>
            </div>
          </div>
        </div>
        <div class="product-card">
          <div class="product-image" style="height:400px;">
            <img src="images/refill.jpg" alt="Refill Scent Kit" class="image-cover" onerror="this.parentElement.innerHTML='<span>Image unavailable</span>'">
          </div>
          <div class="product-info">
            <div class="product-name">Refill Scent Kit</div>
            <div class="product-price">$29</div>
            <div class="product-actions">
              <button class="btn btn-primary w-full" onclick="addToCart('refill-kit', 1)">Add to Bag</button>
            </div>
          </div>
        </div>
        <div class="product-card">
          <div class="product-image" style="height:400px;">
            <img src="images/topper.jpg" alt="Slow Feed Topper" class="image-cover" onerror="this.parentElement.innerHTML='<span>Image unavailable</span>'">
          </div>
          <div class="product-info">
            <div class="product-name">Slow Feed Topper</div>
            <div class="product-price">$19</div>
            <div class="product-actions">
              <button class="btn btn-primary w-full" onclick="addToCart('topper', 1)">Add to Bag</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>

  <div id="site-footer"></div>

  <script src="js/nav.js"></script>
  <script src="js/cart.js"></script>
</body>
</html>
