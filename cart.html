<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cart — Sniffscape</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600&family=Fraunces:wght@600;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/extra.css">
</head>
<body class="antialiased bg-[#faf7f2] text-[#1f2933]">
  <div id="site-header"></div>

  <section class="cart-page">
    <div class="section-head" style="margin-bottom:2rem;">
      <span class="section-kicker">Your cart</span>
      <h2 class="text-[#1f2933] font-heading font-bold mb-2">Review your order</h2>
    </div>

    <div id="cart-items-container">
      <!-- Cart items injected by JS -->
    </div>

    <div class="cart-summary">
      <h3 class="text-[#1f2933] font-heading font-bold mb-6">Order Summary</h3>
      <div class="summary-row">
        <span>Subtotal</span>
        <span id="cart-subtotal">$0</span>
      </div>
      <div class="summary-row">
        <span>Shipping</span>
        <span id="cart-shipping">Calculated at checkout</span>
      </div>
      <div class="summary-row total">
        <span>Total</span>
        <span id="cart-total">$0</span>
      </div>
    </div>

    <div class="mt-6 flex flex-col sm:flex-row gap-3">
      <a href="shop.html" class="btn btn-secondary w-full sm:w-auto flex-1">Continue Shopping</a>
      <button id="checkout-btn" class="btn btn-primary w-full sm:w-auto flex-1" onclick="location.href='checkout.html'">Checkout</button>
    </div>
  </section>

  <div id="site-footer"></div>

  <script src="js/nav.js"></script>
  <script src="js/cart.js"></script>
  <script>
    function renderCart() {
      const container = document.getElementById('cart-items-container');
      const cart = getCart();
      const subtotalEl = document.getElementById('cart-subtotal');
      const totalEl = document.getElementById('cart-total');

      if (cart.length === 0) {
        container.innerHTML = `
          <div class="cart-empty">
            <h2 class="text-[#1f2933] font-heading font-bold mb-2">Your cart is empty</h2>
            <p class="text-[#6b7280]">Looks like you haven't added anything yet.</p>
            <a href="shop.html" class="btn btn-primary mt-4">Start Shopping</a>
          </div>
        `;
        subtotalEl.textContent = '$0';
        totalEl.textContent = '$0';
        document.getElementById('checkout-btn').disabled = true;
        return;
      }

      document.getElementById('checkout-btn').disabled = false;

      let subtotal = 0;
      let html = `
        <table class="cart-table">
          <thead>
            <tr>
              <th>Item</th>
              <th>Price</th>
              <th>Qty</th>
              <th>Total</th>
              <th></th>
            </tr>
          </thead>
          <tbody>
      `;

      cart.forEach(item => {
        const itemTotal = item.price * item.qty;
        subtotal += itemTotal;
        html += `
          <tr class="cart-item-row">
            <td class="cart-item-image">
              <img src="${item.image}" alt="${item.name}" class="image-cover" onerror="this.parentElement.innerHTML='<div class=\"image-block\" style=\"height:100%;width:100%\"><span style=\"color:white\">Image unavailable</span></div>'">
            </td>
            <td>
              <div class="cart-item-name">${item.name}</div>
              <div class="cart-item-price text-sm text-[#6b7280]">$${item.price}</div>
            </td>
            <td>
              <div class="qty-controls">
                <button class="qty-btn" onclick="updateQty('${item.id}', ${item.qty - 1}); renderCart();">&#8722;</button>
                <span class="qty-display">${item.qty}</span>
                <button class="qty-btn" onclick="updateQty('${item.id}', ${item.qty + 1}); renderCart();">&#43;</button>
              </div>
            </td>
            <td class="cart-item-price font-semibold">$${itemTotal}</td>
            <td>
              <button class="remove-item" onclick="removeFromCart('${item.id}'); renderCart();">Remove</button>
            </td>
          </tr>
        `;
      });

      html += `</tbody></table>`;
      container.innerHTML = html;

      subtotalEl.textContent = '$' + subtotal.toFixed(2);
      totalEl.textContent = '$' + subtotal.toFixed(2);
    }

    document.addEventListener('DOMContentLoaded', () => {
      renderCart();
      window.addEventListener('sniffscape-cart-update', renderCart);
    });
  </script>
</body>
</html>
